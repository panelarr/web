        matched_title:
          type: string
        authors_match:
          type: boolean
          description: Absent when one side names no people.
    AddFromSourceResult:
      type: object
      required: [added, candidates]
      properties:
        added:
          type: boolean
        entry:
          $ref: "#/components/schemas/LibraryEntry"
        candidates:
