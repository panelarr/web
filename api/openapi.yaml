          items:
            type: string
        checked_at:
          type: string
          format: date-time
        attached:
          $ref: "#/components/schemas/MatchSeries"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchSeries"
    Work:
      type: object
      required: [id, entry_id, title, content_rating, attached_sources, in_library, sources]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
        content_rating:
          $ref: "#/components/schemas/EntryContentRating"
        year:
          type: integer
        cover_url:
          type: string
        attached_sources:
          type: integer
        in_library:
          type: boolean
        added_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: "#/components/schemas/WorkSourceState"
    MatchWorkRequest:
      type: object
      properties:
        force:
          type: boolean
    TaskRef:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          format: uuid
    AttachSeriesRequest:
      type: object
      description: Either source_id and key, or url.
      properties:
        source_id:
          type: string
          minLength: 3
          maxLength: 300
        key:
          type: string
          minLength: 1
          maxLength: 2000
        url:
          type: string
          minLength: 1
          maxLength: 2000
    UpdateWorkSeriesRequest:
      type: object
      required: [priority]
      properties:
        priority:
          type: integer
          minimum: -1000
          maximum: 1000

    TaskEvent:
      type: object
      description: Data of `task.*` events.
      required: [id, kind, state, attempts]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          $ref: "#/components/schemas/TaskState"
        attempts:
          type: integer
        last_error:
          type: string
        progress:
          $ref: "#/components/schemas/JobProgress"
    JobEvent:
      type: object
      description: Data of `job.*` events.
      required: [job_id, run_id]
      properties:
        job_id:
          type: string
        run_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/JobRunStatus"
        progress:
          $ref: "#/components/schemas/JobProgress"
    PluginEvent:
      type: object
      description: Data of `plugin.health`.
      required: [plugin_id, health]
      properties:
        plugin_id:
          type: string
        health:
          type: string
          enum: [ok, degraded, down, unknown]
        health_message:
          type: string
    WorkEvent:
      type: object
      description: Data of `work.updated`, `chapters.new`, `chapter.downloaded`, `library.changed` and `progress.synced`.
      required: [work_id]
      properties:
        work_id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        new:
          type: integer
          description: "`chapters.new`: how many chapters appeared."
        page:
          type: integer
        completed:
          type: boolean
    JobParam:
      type: object
      required: [name, type, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [bool, int, string, string_list]
          description: How to send the value in `params`, always as a string; `string_list` is comma-separated (e.g. "en,de").
        description:
          type: string
        required:
          type: boolean
        default:
          type: string
        choices:
          type: array
          items:
            type: string
    JobSchedule:
      type: object
      required: [enabled]
      properties:
        interval_seconds:
          type: integer
          description: Absent for jobs run by hand only.
        cron:
          type: string
          description: A cron schedule (the connected services' jobs); absent otherwise.
        time_zone:
          type: string
          description: The IANA time zone a cron schedule runs in (e.g. "UTC"); absent when the service doesn't say.
        enabled:
          type: boolean
        source:
          type: string
          description: Where the schedule is configured (read-only here).
    JobRunStatus:
      type: string
      enum: [running, succeeded, failed, cancelled, skipped]
    JobRunSummary:
      type: object
      required: [id, job_id, status, trigger, started_at, message, counts]
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
        status:
          $ref: "#/components/schemas/JobRunStatus"
        trigger:
          type: string
          enum: [schedule, manual, startup, system]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        message:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
        triggered_by:
          type: string
    JobRunNote:
      type: object
      required: [at, level, message]
      properties:
        at:
          type: string
          format: date-time
        level:
          type: string
        message:
          type: string
        ref:
          type: string
    JobProgress:
      type: object
      required: [done]
      properties:
        phase:
          type: string
        done:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        unit:
          type: string
    JobRun:
      type: object
      required: [summary, params, notes]
      properties:
        summary:
          $ref: "#/components/schemas/JobRunSummary"
        params:
          type: object
          additionalProperties:
            type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/JobRunNote"
        progress:
          $ref: "#/components/schemas/JobProgress"
    JobRunList:
      type: object
      required: [runs, next_page_token]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/JobRunSummary"
        next_page_token:
          type: string
    Job:
      type: object
      required: [id, name, description, group, schedule, running, cancellable, params]
      properties:
        disabled_reason:
          type: string
          description: "Why the job can't run now (e.g. a feature it needs is off); absent when it can. Running it answers `409`, code `job_disabled`, and its schedule doesn't fire meanwhile."
        id:
          type: string
        name:
          type: string
        description:
          type: string
        group:
          type: string
        schedule:
          $ref: "#/components/schemas/JobSchedule"
        running:
          type: boolean
        current_run_id:
          type: string
          format: uuid
        last_run:
          $ref: "#/components/schemas/JobRunSummary"
        next_run_at:
          type: string
          format: date-time
        cancellable:
          type: boolean
        params:
          type: array
          items:
            $ref: "#/components/schemas/JobParam"
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
    RunJobRequest:
      type: object
      properties:
        params:
          type: object
          additionalProperties:
            type: string
            maxLength: 1000

    TaskState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Task:
      type: object
      required: [id, kind, state, priority, attempts, max_attempts, run_after, payload, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: e.g. match.work, update.work, download.chapter.
        state:
          $ref: "#/components/schemas/TaskState"
        priority:
          type: integer
        attempts:
          type: integer
        max_attempts:
          type: integer
        run_after:
          type: string
          format: date-time
          description: When a queued task may run next (retries wait).
        last_error:
          type: string
        progress:
          $ref: "#/components/schemas/JobProgress"
        limit_key:
          type: string
          description: The limit it counts against, e.g. "source:fake:1001".
        payload:
          type: object
          additionalProperties: true
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    TaskList:
      type: object
      required: [tasks, next_page_token]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        next_page_token:
          type: string
    QueueKind:
      type: object
      required: [kind, paused, running, concurrency, queued, failed]
      properties:
        kind:
          type: string
        paused:
          type: boolean
        running:
          type: integer
        concurrency:
          type: integer
        queued:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
    QueueState:
      type: object
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/QueueKind"
    UpdateQueueKindRequest:
      type: object
      required: [paused]
      properties:
        paused:
          type: boolean

    RateLimit:
      type: object
      required: [requests, period_seconds]
      properties:
        requests:
          type: integer
        period_seconds:
          type: number
        burst:
          type: integer
    Plugin:
      type: object
      required: [id, url, enabled, name, version, contracts, capabilities, has_config, health, source_count, created_at]
      properties:
        id:
          type: string
        url:
          type: string
        enabled:
          type: boolean
        name:
          type: string
          description: The plugin's own name.
        plugin_id:
          type: string
          description: The plugin's own ID (what it reports), e.g. to tell instances of one plugin apart.
        version:
          type: string
        contracts:
          type: array
          items:
            type: string
        capabilities:
          type: array
          description: What the plugin supports beyond the contract, e.g. `packages` (it installs packages that provide sources; show its packages) or `network_profiles`.
          items:
            type: string
        max_concurrency_per_source:
          type: integer
          description: How many calls per source the plugin takes at once, when it says.
        default_rate_limit:
          $ref: "#/components/schemas/RateLimit"
        has_config:
          type: boolean
          description: The plugin has settings (see its config).
        health:
          type: string
          enum: [ok, degraded, down, unknown]
        health_message:
          type: string
        checked_at:
          type: string
          format: date-time
        source_count:
          type: integer
          format: int64
          description: Sources the plugin lists now.
        created_at:
          type: string
          format: date-time
    PluginList:
      type: object
      required: [plugins]
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
    RegisterPluginRequest:
      type: object
      required: [url]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
        url:
          type: string
          minLength: 1
          maxLength: 500
          description: The plugin service's base URL, e.g. "http://source-plugin:8904".
        api_key:
          type: string
          maxLength: 500
    UpdatePluginRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 500
        api_key:
          type: string
          maxLength: 500
          description: The new key; an empty string removes it.
        enabled:
          type: boolean
    PluginConfig:
      type: object
      required: [schema, values]
      properties:
        schema:
          type: object
          additionalProperties: true
          description: The plugin's JSON Schema for its configuration. Render the form from it.
        values:
          type: object
          additionalProperties: true
    SetPluginConfigRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true

    SourceHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, failing, unknown]
        reason:
          type: string
          description: Why it fails, e.g. CLOUDFLARE_CHALLENGE or SOURCE_DOWN.
        message:
          type: string
        checked_at:
          type: string
          format: date-time
        checks_disabled:
          type: boolean
          description: Its scheduled health checks are turned off (plugins with the `health_checks` capability).
    SourceInfo:
      type: object
      required: [id, plugin_id, name, lang, content_rating, capabilities, health, enabled, present]
      properties:
        id:
          type: string
          description: '"plugin:source".'
        plugin_id:
          type: string
        name:
          type: string
        lang:
          type: string
        content_rating:
          type: string
          enum: [safe, mixed, nsfw, unknown]
        icon_url:
          type: string
          description: The server's URL for the source's icon.
        home_url:
          type: string
        capabilities:
          type: array
          description: latest, search, filters, resolve_url, settings, needs_webview, nsfw.
          items:
            type: string
        health:
          $ref: "#/components/schemas/SourceHealth"
        enabled:
          type: boolean
        present:
          type: boolean
          description: The plugin still lists it.
        unavailable_reason:
          type: string
          enum: [language]
          description: |
            Why a source the plugin no longer lists (`present: false`) is
            missing, when known: `language` means its package is still
            installed but its language is turned off (the plugin's or the
            package's languages), so show it as "not available" rather than
            gone. Absent without a reason: no longer provided (e.g. its
            package was uninstalled). Either way it isn't used and nothing
            of it is deleted.
        package_id:
          type: string
          description: The package (e.g. extension) that provides it, on plugins with the `packages` capability.
        package_name:
          type: string
    SourceList:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceInfo"
    UpdateSourceRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    PackageList:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            $ref: "#/components/schemas/Package"
    Package:
      type: object
      description: A package that provides sources, e.g. an extension.
      required: [id, name, langs, version, installed, update_available, content_rating, supported, offers, sources, enabled_langs]
      properties:
        id:
          type: string
        name:
          type: string
        langs:
          type: array
          description: Languages its sources cover (BCP 47, or "all"/"multi").
          items:
            type: string
        version:
          type: string
          description: The newest version offered.
        installed:
          type: boolean
        installed_version:
          type: string
        update_available:
          type: boolean
        content_rating:
          type: string
          enum: [safe, mixed, nsfw, unknown]
        supported:
          type: boolean
          description: The plugin can run the version offered.
        offers:
          type: array
          description: Where it can come from (e.g. stores).
          items:
            $ref: "#/components/schemas/PackageOffer"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PackageSource"
        enabled_langs:
          type: array
          description: The languages chosen for it; empty means every language the plugin allows.
          items:
            type: string
        error:
          type: string
          description: Why an installed package isn't working.
        details:
          $ref: "#/components/schemas/PackageDetails"
        icon_url:
          type: string
          description: The server's URL for the package's icon, when it has one.
        task_id:
          type: string
          format: uuid
          description: An install, update or uninstall of it that is queued or running.
    PackageOffer:
      type: object
      required: [origin_id, origin_name, version, supported]
      properties:
        origin_id:
          type: string
        origin_name:
          type: string
        version:
          type: string
        supported:
          type: boolean
    PackageSource:
      type: object
      required: [id, name, lang, available]
      properties:
        id:
          type: string
          description: The source's ID on the server ("plugin:source") once installed.
        name:
          type: string
        lang:
          type: string
        available:
          type: boolean
          description: Its language is turned on at the plugin's and the package's level, so it is listed while the package is installed. An admin may still turn the source off.
    InstallPackageRequest:
      type: object
      properties:
        origin_id:
          type: string
          maxLength: 200
          description: Which offer to install; empty lets the plugin pick the best one.
    PackageLanguages:
      type: object
      required: [enabled_langs]
      properties:
        enabled_langs:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 35
    Solver:
      type: object
      description: A challenge solver (FlareSolverr-compatible), shared or custom to one owner.
      required: [id, name, type, url, as_response_fallback, created_at, updated_at]
      properties:
        owner:
          $ref: "#/components/schemas/ProfileOwner"
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/SolverType"
        url:
          type: string
          description: Its base URL, e.g. http://flaresolverr:8191.
        session_ttl_seconds:
          type: integer
          description: How long a session or its clearance cookies are reused; absent means the plugin's default.
        max_timeout_seconds:
          type: integer
          description: Upper bound for one solve; absent means the plugin's default.
        as_response_fallback:
          type: boolean
          description: Use the solver's own response when a fresh request still fails.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SolverType:
      type: string
      enum: [flaresolverr, byparr]
    SolverList:
      type: object
      required: [solvers]
      properties:
        solvers:
          type: array
          items:
            $ref: "#/components/schemas/Solver"
    NewSolver:
      type: object
      required: [id, name, type, url]
      properties:
        owner:
          $ref: "#/components/schemas/ProfileOwner"
          description: Makes it custom to one plugin, extension, source or provider (only usable by profiles of that owner, removed with its plugin).
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: "#/components/schemas/SolverType"
        url:
          type: string
          maxLength: 2000
        session_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        max_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        as_response_fallback:
          type: boolean
    UpdateSolverRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: "#/components/schemas/SolverType"
        url:
          type: string
          maxLength: 2000
        session_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 604800
        max_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 3600
        as_response_fallback:
          type: boolean
    Proxy:
      type: object
      description: An HTTP, HTTPS or SOCKS5 proxy, shared or custom to one owner. The password is never returned.
      required: [id, name, url, has_password, created_at, updated_at]
      properties:
        owner:
          $ref: "#/components/schemas/ProfileOwner"
        id:
          type: string
        name:
          type: string
        url:
          type: string
          description: http://, https:// or socks5://host:port, without credentials.
        username:
          type: string
        has_password:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProxyList:
      type: object
      required: [proxies]
      properties:
        proxies:
          type: array
          items:
            $ref: "#/components/schemas/Proxy"
    NewProxy:
      type: object
      required: [id, name, url]
      properties:
        owner:
          $ref: "#/components/schemas/ProfileOwner"
          description: Makes it custom to one plugin, extension, source or provider (only usable by profiles of that owner, removed with its plugin).
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          maxLength: 2000
        username:
          type: string
          maxLength: 500
        password:
          type: string
          maxLength: 2000
          description: Stored encrypted; never returned.
    UpdateProxyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          maxLength: 2000
        username:
          type: string
          maxLength: 500
          description: Empty removes the credentials.
        password:
          type: string
          maxLength: 2000
          description: Empty or absent keeps the stored one.
    ProxyTarget:
      type: object
      properties:
        url:
          type: string
          maxLength: 2000
          description: An http(s) URL to request through the proxy. Without it, the check only connects to the proxy.
    ProxyTestRequest:
      type: object
      required: [proxy]
      properties:
        proxy:
          $ref: "#/components/schemas/NewProxy"
        url:
          type: string
          maxLength: 2000
          description: An http(s) URL to request through the proxy. Without it, the check only connects to the proxy. A saved proxy's stored password is used when the password is left empty.
    NetworkTest:
      type: object
      required: [ok, message, latency_ms]
      properties:
        ok:
          type: boolean
        message:
          type: string
        version:
          type: string
          description: The solver's version, when it says.
        latency_ms:
          type: integer
    SetBookmarksRequest:
      type: object
      required: [chapter_ids, bookmarked]
      properties:
        chapter_ids:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: string
            format: uuid
        bookmarked:
          type: boolean
    BookmarkList:
      type: object
      required: [chapter_ids]
      properties:
        chapter_ids:
          type: array
          items:
            type: string
            format: uuid
    ProfileOwnerKind:
      type: string
      enum: [plugin, package, source, provider]
    ProfileOwner:
      type: object
      required: [kind, id]
      properties:
        kind:
          $ref: "#/components/schemas/ProfileOwnerKind"
        id:
          type: string
          minLength: 1
          maxLength: 300
          description: A plugin ID, "plugin:package", a source ID or a provider ID.
    NetworkRateLimit:
      type: object
      required: [requests, period_seconds]
      properties:
        requests:
          type: integer
          minimum: 1
          maximum: 100000
        period_seconds:
          type: number
          minimum: 0.001
          maximum: 86400
        burst:
          type: integer
          minimum: 0
          maximum: 100000
        scope:
          type: string
          enum: [source, host]
          description: One budget per source (the default) or per target host.
    NetworkUserAgent:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [default, fixed, random_desktop, from_solver]
          description: "`default`: the plugin's; `from_solver` needs a solver."
        value:
          type: string
          maxLength: 1000
          description: The user agent, for `fixed`.
    NetworkTimeouts:
      type: object
      properties:
        connect_seconds:
          type: number
          minimum: 0
          maximum: 3600
        read_seconds:
          type: number
          minimum: 0
          maximum: 3600
        call_seconds:
          type: number
          minimum: 0
          maximum: 3600
    NetworkProfileSettings:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        proxy_id:
          type: string
          description: The proxy; absent means a direct connection.
        solver_id:
          type: string
          description: The challenge solver; absent means none.
        rate_limit:
          $ref: "#/components/schemas/NetworkRateLimit"
        concurrency:
          type: integer
          minimum: 0
          maximum: 1000
          description: Parallel requests per source; absent or 0 means the plugin's default.
        user_agent:
          $ref: "#/components/schemas/NetworkUserAgent"
        doh_url:
          type: string
          maxLength: 2000
          description: DNS-over-HTTPS resolver; absent means the system resolver.
        headers:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: Extra headers on every request.
        shared_cookie_jar:
          type: string
          maxLength: 100
          description: Name of a cookie jar shared with other sources; absent means each source has its own.
        timeouts:
          $ref: "#/components/schemas/NetworkTimeouts"
    NewNetworkProfile:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
        owner:
          $ref: "#/components/schemas/ProfileOwner"
        name:
          type: string
          minLength: 1
          maxLength: 200
        proxy_id:
          type: string
          description: The proxy; absent means a direct connection.
        solver_id:
          type: string
          description: The challenge solver; absent means none.
        rate_limit:
          $ref: "#/components/schemas/NetworkRateLimit"
        concurrency:
          type: integer
          minimum: 0
          maximum: 1000
          description: Parallel requests per source; absent or 0 means the plugin's default.
        user_agent:
          $ref: "#/components/schemas/NetworkUserAgent"
        doh_url:
          type: string
          maxLength: 2000
          description: DNS-over-HTTPS resolver; absent means the system resolver.
        headers:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: Extra headers on every request.
        shared_cookie_jar:
          type: string
          maxLength: 100
          description: Name of a cookie jar shared with other sources; absent means each source has its own.
        timeouts:
          $ref: "#/components/schemas/NetworkTimeouts"
    NetworkProfile:
      type: object
      required: [id, name, user_agent, headers, timeouts, assigned_to, created_at, updated_at]
      properties:
        id:
          type: string
        owner:
          $ref: "#/components/schemas/ProfileOwner"
        name:
          type: string
          minLength: 1
          maxLength: 200
        proxy_id:
          type: string
          description: The proxy; absent means a direct connection.
        solver_id:
          type: string
          description: The challenge solver; absent means none.
        rate_limit:
          $ref: "#/components/schemas/NetworkRateLimit"
        concurrency:
          type: integer
          minimum: 0
          maximum: 1000
          description: Parallel requests per source; absent or 0 means the plugin's default.
        user_agent:
          $ref: "#/components/schemas/NetworkUserAgent"
        doh_url:
          type: string
          maxLength: 2000
          description: DNS-over-HTTPS resolver; absent means the system resolver.
        headers:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 2000
          description: Extra headers on every request.
        shared_cookie_jar:
          type: string
          maxLength: 100
          description: Name of a cookie jar shared with other sources; absent means each source has its own.
        timeouts:
          $ref: "#/components/schemas/NetworkTimeouts"
        assigned_to:
          type: array
          description: Where it is assigned.
          items:
            $ref: "#/components/schemas/NetworkTarget"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NetworkProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/NetworkProfile"
    NetworkTargetKind:
      type: string
      enum: [global, plugin, package, source, meta, provider]
    NetworkTarget:
      type: object
      required: [target_kind, target_id]
      properties:
        target_kind:
          $ref: "#/components/schemas/NetworkTargetKind"
        target_id:
          type: string
          description: Empty for `global` and `meta`.
    NetworkAssignmentRequest:
      type: object
      required: [target_kind]
      properties:
        target_kind:
          $ref: "#/components/schemas/NetworkTargetKind"
        target_id:
          type: string
          maxLength: 300
        profile_id:
          type: string
          maxLength: 40
        plugin_default:
          type: boolean
          description: Use the plugin's own settings here (instead of profile_id).
    NetworkAssignment:
      type: object
      required: [target_kind, target_id, plugin_default, updated_at]
      properties:
        target_kind:
          $ref: "#/components/schemas/NetworkTargetKind"
        target_id:
          type: string
        profile_id:
          type: string
        plugin_default:
          type: boolean
        updated_at:
          type: string
          format: date-time
    NetworkAssignmentList:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/NetworkAssignment"
    NetworkEffective:
      type: object
      required: [level, plugin_default]
      properties:
        level:
          type: string
          enum: [source, package, plugin, global, provider, meta, none]
          description: Where it comes from; `none` means nothing is assigned (the plugin's own settings).
        profile_id:
          type: string
        plugin_default:
          type: boolean
          description: The plugin's own settings are in force.
    SourceNetwork:
      type: object
      required: [source_id, name, effective]
      properties:
        source_id:
          type: string
        name:
          type: string
        lang:
          type: string
        package_id:
          type: string
        present:
          type: boolean
        assignment:
          $ref: "#/components/schemas/NetworkAssignment"
        effective:
          $ref: "#/components/schemas/NetworkEffective"
        push:
          $ref: "#/components/schemas/NetworkPush"
        applied:
          $ref: "#/components/schemas/NetworkApplied"
    NetworkPush:
      type: object
      required: [state]
      description: Whether the plugin has the profile in force.
      properties:
        state:
          type: string
          enum: [pushed, pending, failed, not_needed, not_accepted]
          description: |
            `pushed`: the plugin has it; `pending`: it changed and is on its
            way (or the plugin is down); `failed`: the last push failed
            (tried again at the next sync); `not_needed`: nothing assigned
            and nothing pushed before; `not_accepted`: the plugin doesn't
            take network profiles.
        pushed_at:
          type: string
          format: date-time
        error:
          type: string
    NetworkApplied:
      type: object
      required: [origin]
      description: What the plugin says it applies (only from GET /sources/{source_id}/network).
      properties:
        origin:
          type: string
          enum: [pushed, plugin, none, unknown]
          description: "`pushed`: Panelarr's profile; `plugin`: the plugin's own settings; `none`: a direct connection; `unknown`: the plugin can't say."
        profile_name:
          type: string
    MetaNetwork:
      type: object
      required: [providers]
      properties:
        assignment:
          $ref: "#/components/schemas/NetworkAssignment"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderNetwork"
    ProviderNetwork:
      type: object
      required: [provider_id, accepts_profiles, effective, push, applied]
      properties:
        provider_id:
          type: string
        accepts_profiles:
          type: boolean
          description: Its plugin takes network profiles (meta gives them only to those).
        assignment:
          $ref: "#/components/schemas/NetworkAssignment"
        effective:
          $ref: "#/components/schemas/NetworkEffective"
        push:
          $ref: "#/components/schemas/NetworkPush"
        applied:
          type: object
          required: [origin]
          description: What meta applies to the provider.
          properties:
            origin:
              type: string
              enum: [pushed, meta, meta_default, none]
              description: "`pushed`: Panelarr's profile; `meta`/`meta_default`: meta's own assignment or default; `none`: a direct connection."
            profile_name:
              type: string
            pushed_at:
              type: string
              format: date-time
    PluginNetwork:
      type: object
      required: [plugin_id, accepts_profiles, accepts_solver, packages, sources]
      properties:
        plugin_id:
          type: string
        accepts_profiles:
          type: boolean
          description: The plugin declares the network profile service; others never receive profiles.
        accepts_solver:
          type: boolean
          description: The plugin declares the solver service; others receive profiles without the solver.
        assignment:
          $ref: "#/components/schemas/NetworkAssignment"
        packages:
          type: array
          description: Assignments at the plugin's packages.
          items:
            $ref: "#/components/schemas/NetworkAssignment"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceNetwork"
    SourceSettings:
      type: object
      required: [schema, values]
      properties:
        schema:
          type: object
          additionalProperties: true
          description: The source's JSON Schema for its settings. Render the form from it.
        values:
          type: object
          additionalProperties: true
    SetSourceSettingsRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true
    MetaProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MetaProviderDetail"
    MetaProviderDetail:
      type: object
      required: [id, mode, health, schedules, record_count, last_runs]
      properties:
        id:
          type: string
        mode:
          type: string
          description: How meta runs its plugin (e.g. in process or as a service).
        plugin_id:
          type: string
        plugin_name:
          type: string
        plugin_version:
          type: string
        health:
          type: string
          enum: [ok, degraded, down, unknown]
        health_message:
          type: string
        schedules:
          type: object
          additionalProperties:
            type: string
          description: Sync schedules per ingestion kind, from meta's configuration (read-only).
        record_count:
          type: integer
          format: int64
        last_runs:
          type: array
          items:
            $ref: "#/components/schemas/MetaSyncRun"
    MetaSyncRunList:
      type: object
      required: [runs, next_page_token]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/MetaSyncRun"
        next_page_token:
          type: string
    MetaSyncRun:
      type: object
      required: [id, provider, kind, status, trigger, upserts, changed, removals, merges, skipped, marked_removed, notices]
      properties:
        id:
          type: string
        provider:
          type: string
        kind:
          type: string
          description: The ingestion kind, e.g. dump or delta.
        status:
          type: string
          enum: [running, succeeded, failed, cancelled, unknown]
        trigger:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        snapshot_id:
          type: string
        cursor_start:
          type: string
        cursor_end:
          type: string
        upserts:
          type: integer
          format: int64
          description: Records received.
        changed:
          type: integer
          format: int64
          description: Records that changed what meta had stored.
        removals:
          type: integer
          format: int64
        merges:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        marked_removed:
          type: integer
          format: int64
          description: Records marked removed because a full snapshot no longer had them.
        error:
          type: string
        notices:
          type: array
          items:
            $ref: "#/components/schemas/MetaNotice"
        progress:
          type: object
          additionalProperties: true
          description: The plugin's last progress report (its own fields, e.g. bytes downloaded).
    MetaNotice:
      type: object
      required: [level, message]
      properties:
        level:
          type: string
        message:
          type: string
        ref:
          type: string
        at:
          type: string
          format: date-time
    MetaServiceHealth:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          enum: [ok, degraded, down, unknown]
        version:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/MetaComponentHealth"
    MetaComponentHealth:
      type: object
      required: [name, kind, status, details]
      properties:
        name:
          type: string
          description: '"database", "search" or "provider:<id>".'
        kind:
          type: string
        status:
          type: string
          enum: [ok, degraded, down, unknown]
        message:
          type: string
        latency_ms:
          type: integer
        checked_at:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties:
            type: string
    MetaEntryRefresh:
      type: object
      required: [refreshed, failed]
      properties:
        refreshed:
          type: array
          items:
            type: string
          description: Providers that returned fresh data.
        failed:
          type: object
          additionalProperties:
            type: string
          description: Providers that failed, with the reason.
    DuplicatePage:
      type: object
      required: [pairs, next_page_token, total_size]
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/DuplicatePair"
        next_page_token:
          type: string
        total_size:
          type: integer
          format: int64
    DuplicatePair:
      type: object
      required: [id, entry_a, entry_b, status, score, signals, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        entry_a:
          $ref: "#/components/schemas/CatalogEntrySummary"
        entry_b:
          $ref: "#/components/schemas/CatalogEntrySummary"
        status:
          type: string
          enum: [open, confirmed, dismissed, unknown]
