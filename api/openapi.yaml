openapi: 3.1.0
info:
  title: Panelarr API
  version: 1.0.0-dev
  summary: The public client API of the Panelarr server.
  description: |
    Everything the Panelarr web app does goes through this API, and any other
    client may use it too. Paths are relative to `/api/v1`. Breaking changes
    need a new major path (`/api/v2`); CI checks every change against the
    published spec.

    ## Authentication

    - **Browser sessions:** `POST /auth/login` sets an HTTP-only session
      cookie (`panelarr_session`) and a readable CSRF cookie
      (`panelarr_csrf`). Requests that change something (any method other
      than GET, HEAD and OPTIONS) made with the session cookie must send the
      CSRF token in the `X-CSRF-Token` header.
    - **Personal API keys** (`pnl_…`): send `X-Api-Key: <key>` or
      `Authorization: Bearer <key>`. No CSRF token is needed. A key acts as
      its owner, limited by its scopes: `read` (GET requests), `write`
      (everything else), `admin` (admin endpoints, for admins' keys) and
      `metrics:read` (`/metrics` on the API port).

    Some endpoints need a browser session (marked "session only"): changing
    the password and managing sessions and API keys can't be done with a key.

    ## First run

    Until the first account exists, every endpoint except the setup ones
    answers `409` with code `setup_required`. `POST /setup/admin` creates
    that account, which becomes the admin.

    ## Errors

    Errors use RFC 9457 problem details (`application/problem+json`) with a
    stable, machine-readable `code`.

    ## Lists

    Lists are cursor-paginated: pass `page_token` from the previous
    response's `next_page_token`; an empty token means the last page.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - apiKeyHeader: []
  - bearer: []
tags:
  - name: system
    description: Server information and health.
  - name: setup
    description: The first-run wizard.
  - name: auth
    description: Signing in and out, and invites.
  - name: me
    description: The signed-in user's own account, sessions and API keys.
  - name: users
    description: Managing users (admins).
  - name: invites
    description: Invite links for new users (admins).
  - name: meta
    description: The connection to the metadata service (admins).
  - name: catalog
    description: Searching and browsing the metadata catalogue, to find works to add.
  - name: plugins
    description: Source plugins (admins).
  - name: sources
    description: |
      Listing and browsing sources through their plugins (admins). Sources
      are an admin concern: regular users see sources only on a work
      (`GET /works/{work_id}` and its series' chapters). Browsing is the
      admin's test view and also works on a source turned off; a source its
      plugin no longer lists, or of a plugin turned off, answers `404`.
  - name: jobs
    description: Named background jobs and their runs (admins).
  - name: tasks
    description: The task queue (admins).
  - name: library
    description: Your library, works and how they are matched on sources.
  - name: chapters
    description: Works' unified chapters and update checks.
  - name: reader
    description: Pages, progress, history and reader settings.
  - name: downloads
    description: Downloading chapters into the shared library.
  - name: storage
    description: Where downloads are stored (admins).

paths:
  /system/info:
    get:
      operationId: getSystemInfo
      tags: [system]
      summary: Server name, version and setup state
      description: Needs no authentication, so clients can recognise a Panelarr server and whether it still needs setting up before signing in.
      security: []
      x-panelarr-access: public
      x-panelarr-setup: true
      responses:
        "200":
          description: Server information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Problem"

  /system/health:
    get:
      operationId: getSystemHealth
      tags: [system]
      summary: Detailed health (admins)
      description: Every component the server depends on, with its status and the error if it fails. `degraded` means an optional component fails and the server keeps serving what it can.
      x-panelarr-access: admin
      responses:
        "200":
          description: The health of each component.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemHealth"
        default:
          $ref: "#/components/responses/Problem"

  /setup:
    get:
      operationId: getSetup
      tags: [setup]
      summary: First-run wizard state
      security: []
      x-panelarr-access: public
      x-panelarr-setup: true
      responses:
        "200":
          description: Where the wizard stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"

  /setup/admin:
    post:
      operationId: createSetupAdmin
      tags: [setup]
      summary: Create the first account (the admin)
      description: Works only while no account exists; afterwards it answers `409` with code `already_set_up`. Signs the new admin in (sets the session cookies).
      security: []
      x-panelarr-access: public
      x-panelarr-setup: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSetupAdminRequest"
      responses:
        "201":
          description: The admin, signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Problem"

  /setup/complete:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Finish the first-run wizard
      x-panelarr-access: admin
      responses:
        "200":
          description: The wizard is complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Problem"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a username and password
      description: |
        Sets the session cookie and the CSRF cookie, and returns the CSRF
        token. Wrong credentials answer `401` with code
        `invalid_credentials`; too many failed attempts answer `429` with
        code `rate_limited` and a `Retry-After` header.
      security: []
      x-panelarr-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (session only)
      description: Ends the current session and clears the cookies.
      x-panelarr-access: user
      x-panelarr-session-only: true
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /auth/invites/check:
    post:
      operationId: checkInvite
      tags: [auth]
      summary: Check an invite token before signing up
      description: The token travels in the body, never in a URL, so it doesn't end up in logs. An unknown, used or expired token answers `404` with code `invite_invalid`.
      security: []
      x-panelarr-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToken"
      responses:
        "200":
          description: The invite is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCheck"
        default:
          $ref: "#/components/responses/Problem"

  /auth/invites/accept:
    post:
      operationId: acceptInvite
      tags: [auth]
      summary: Create an account from an invite
      description: Creates the user with the invite's role and grants, uses up the invite and signs the user in.
      security: []
      x-panelarr-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          description: The new user, signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Problem"

  /me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      x-panelarr-access: user
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Change your own profile
      x-panelarr-access: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /me/password:
    post:
      operationId: changeMyPassword
      tags: [me]
      summary: Change your own password (session only)
      description: Needs the current password (`403` with code `invalid_credentials` otherwise). Ends every other session of the user.
      x-panelarr-access: user
      x-panelarr-session-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        default:
          $ref: "#/components/responses/Problem"

  /me/sessions:
    get:
      operationId: listMySessions
      tags: [me]
      summary: Your signed-in sessions (session only)
      x-panelarr-access: user
      x-panelarr-session-only: true
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        default:
          $ref: "#/components/responses/Problem"

  /me/sessions/{id}:
    delete:
      operationId: deleteMySession
      tags: [me]
      summary: Sign out another session (session only)
      x-panelarr-access: user
      x-panelarr-session-only: true
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Problem"

  /me/api-keys:
    get:
      operationId: listMyApiKeys
      tags: [me]
      summary: Your API keys (session only)
      x-panelarr-access: user
      x-panelarr-session-only: true
      responses:
        "200":
          description: Keys, newest first. The keys themselves are never shown again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createMyApiKey
      tags: [me]
      summary: Create an API key (session only)
      description: The key is in this response only; the server keeps just its hash. `admin` and `metrics:read` scopes need an admin account.
      x-panelarr-access: user
      x-panelarr-session-only: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        default:
          $ref: "#/components/responses/Problem"

  /me/api-keys/{id}:
    delete:
      operationId: deleteMyApiKey
      tags: [me]
      summary: Revoke an API key (session only)
      x-panelarr-access: user
      x-panelarr-session-only: true
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Users by username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a password
      description: A taken username answers `409` with code `username_taken`.
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The new user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      x-panelarr-access: admin
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Change a user
      description: |
        Only the fields sent change. Setting `password` resets it and ends
        the user's sessions; disabling a user ends their sessions and stops
        their API keys from working. The last enabled admin can't be
        disabled or demoted (`409`, code `last_admin`), and admins can't
        disable or demote themselves (`409`, code `cannot_change_self`).
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      description: Deletes the account with its sessions and API keys. Content they added stays (it is shared). Admins can't delete themselves (`409`, code `cannot_change_self`).
      x-panelarr-access: admin
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

  /invites:
    get:
      operationId: listInvites
      tags: [invites]
      summary: List open invites
      description: Invites that are neither used nor expired, newest first.
      x-panelarr-access: admin
      responses:
        "200":
          description: Open invites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInvite
      tags: [invites]
      summary: Create an invite
      description: The token is in this response only. The web app builds the invite link from it (as a URL fragment, so it never reaches server logs).
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: The new invite and its token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        default:
          $ref: "#/components/responses/Problem"

  /invites/{id}:
    delete:
      operationId: deleteInvite
      tags: [invites]
      summary: Revoke an invite
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Problem"

  /system/meta:
    get:
      operationId: getMetaConnection
      tags: [meta]
      summary: The metadata service connection and its state
      description: Panelarr needs the metadata service for its library. Until it is reachable, has an admin key and a provider with entries, the server is degraded and nothing can be added; `check.problem` says what to do.
      x-panelarr-access: admin
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnection"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setMetaConnection
      tags: [meta]
      summary: Connect the metadata service
      description: |
        Tests the URL and key first. They are saved when the service is
        reachable and the key has the admin scope, even if no provider has
        data yet (the check says so). Otherwise nothing is saved and the
        answer is `422` with code `meta_check_failed` and what to fix. When
        the connection comes from `PANELARR_META_URL`, it can't be changed
        here (`409`, code `managed_by_env`).
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMetaConnectionRequest"
      responses:
        "200":
          description: Saved; the check result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnection"
        default:
          $ref: "#/components/responses/Problem"

  /system/meta/check:
    post:
      operationId: checkMetaConnection
      tags: [meta]
      summary: Check the metadata service again now
      x-panelarr-access: admin
      responses:
        "200":
          description: A fresh check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaConnection"
        default:
          $ref: "#/components/responses/Problem"

  /system/meta/providers/{provider}/sync:
    post:
      operationId: runMetaProviderSync
      tags: [meta]
      summary: Start a sync of a metadata provider
      description: |
        Starts a sync in the metadata service and returns at once. A first
        full import can take a while; check the connection to see entries
        arrive. When the metadata service is up but the provider's plugin
        isn't reachable from it, the answer is `502` with code
        `meta_provider_unavailable` (start the plugin); `503`
        `meta_unavailable` means the metadata service itself didn't answer.
      x-panelarr-access: admin
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunMetaSyncRequest"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaSyncStarted"
        default:
          $ref: "#/components/responses/Problem"

  /catalog/search:
    get:
      operationId: searchCatalog
      tags: [catalog]
      summary: Search the catalogue by title
      description: |
        Searches every title (all languages and romanizations). Only
        entries within the caller's content-rating ceiling are returned.
        Errors from the metadata service, for every catalogue call: `503`
        `meta_unavailable` when it can't be reached or isn't connected yet;
        `502` `meta_key_rejected` when it refuses the server's key; `502`
        `meta_error` when it answers with another error.
      x-panelarr-access: user
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/CatalogType"
        - $ref: "#/components/parameters/CatalogStatus"
        - $ref: "#/components/parameters/CatalogGenre"
        - $ref: "#/components/parameters/YearFrom"
        - $ref: "#/components/parameters/YearTo"
        - $ref: "#/components/parameters/CatalogSort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CatalogPageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Matching entries, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogSearchPage"
        default:
          $ref: "#/components/responses/Problem"

  /catalog/browse:
    get:
      operationId: browseCatalog
      tags: [catalog]
      summary: Browse the catalogue
      description: Discovery without search text, with filters and a sort. Only entries within the caller's content-rating ceiling are returned.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/CatalogType"
        - $ref: "#/components/parameters/CatalogStatus"
        - $ref: "#/components/parameters/CatalogGenre"
        - $ref: "#/components/parameters/YearFrom"
        - $ref: "#/components/parameters/YearTo"
        - $ref: "#/components/parameters/CatalogSort"
        - $ref: "#/components/parameters/Reverse"
        - $ref: "#/components/parameters/Lang"
        - $ref: "#/components/parameters/CatalogPageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        default:
          $ref: "#/components/responses/Problem"

  /catalog/entries/{entry_id}:
    get:
      operationId: getCatalogEntry
      tags: [catalog]
      summary: One catalogue entry in full
      description: Entries above the caller's content-rating ceiling answer `404` like missing ones.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogEntry"
        default:
          $ref: "#/components/responses/Problem"

  /catalog/entries/{entry_id}/cover:
    get:
      operationId: getCatalogEntryCover
      tags: [catalog]
      summary: An entry's cover image
      description: Served by the server from its cache, so browsers never contact metadata sites. `404` when the entry has no cover or the caller may not see it.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List source plugins
      x-panelarr-access: admin
      responses:
        "200":
          description: Plugins by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: registerPlugin
      tags: [plugins]
      summary: Add a source plugin running as a service
      description: |
        The server checks the plugin answers and speaks the source plugin
        contract (`422`, code `plugin_unreachable`, otherwise), stores it and
        lists its sources. The ID names this plugin instance and prefixes
        its sources' IDs; it defaults to the plugin's own ID. A taken ID
        answers `409`, code `plugin_id_taken`.
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPluginRequest"
      responses:
        "201":
          description: The plugin, with its sources synced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        default:
          $ref: "#/components/responses/Problem"

  /plugins/{plugin_id}:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      operationId: getPlugin
      tags: [plugins]
      summary: Get a plugin
      x-panelarr-access: admin
      responses:
        "200":
          description: The plugin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updatePlugin
      tags: [plugins]
      summary: Change a plugin's address or key, or turn it off
      description: A new address or key is checked before it is saved.
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePluginRequest"
      responses:
        "200":
          description: The plugin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlugin
      tags: [plugins]
      summary: Remove a plugin and its sources
      x-panelarr-access: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /plugins/{plugin_id}/sync:
    post:
      operationId: syncPlugin
      tags: [plugins]
      summary: Refresh a plugin's info, health and sources now
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/PluginId"
      responses:
        "200":
          description: The plugin after the sync. A plugin that didn't answer shows health `down`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        default:
          $ref: "#/components/responses/Problem"

  /plugins/{plugin_id}/config:
    parameters:
      - $ref: "#/components/parameters/PluginId"
    get:
      operationId: getPluginConfig
      tags: [plugins]
      summary: A plugin's configuration and its schema
      description: Secret fields (`writeOnly` in the schema) come back empty. A plugin without configuration answers `404`, code `no_config`.
      x-panelarr-access: admin
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfig"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setPluginConfig
      tags: [plugins]
      summary: Replace a plugin's configuration
      description: The plugin validates and applies it; the server keeps it (encrypted) and hands it back whenever the plugin restarts. Secret fields left empty keep their current value.
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPluginConfigRequest"
      responses:
        "200":
          description: The configuration as the plugin now reports it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfig"
        default:
          $ref: "#/components/responses/Problem"

  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: The sources of every plugin
      description: |
        Every usable source; with `all=true` also disabled ones and ones
        their plugin no longer lists. Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
        - name: lang
          in: query
          description: Only sources in this language.
          schema:
            type: string
            maxLength: 35
        - name: plugin_id
          in: query
          description: Only this plugin's sources.
          schema:
            type: string
            maxLength: 64
        - name: enabled
          in: query
          description: Only sources turned on (`true`) or off (`false`) by an admin. Turned-off sources show only with `all=true`.
          schema:
            type: boolean
        - name: present
          in: query
          description: Only sources their plugin lists (`true`) or no longer lists (`false`). Absent sources show only with `all=true`.
          schema:
            type: boolean
      responses:
        "200":
          description: Sources by plugin and name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}:
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Turn a source on or off for everyone
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourceRequest"
      responses:
        "200":
          description: The source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInfo"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/popular:
    get:
      operationId: sourcePopular
      tags: [sources]
      summary: A source's popular series
      description: |
        Errors from the source answer `502` with code `source_failed` (the reason, e.g. a challenge page or the site being down, is in the detail), or `429` with code `rate_limited`.
        Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourcePage"
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSeriesPage"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/latest:
    get:
      operationId: sourceLatest
      tags: [sources]
      summary: A source's latest updates
      description: |
        `422`, code `unsupported`, when the source has no latest list.
        Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourcePage"
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSeriesPage"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/search:
    post:
      operationId: sourceSearch
      tags: [sources]
      summary: Search a source
      description: |
        A POST because filter values are structured; it only reads, so an API key needs `read` (and `admin`), not `write`.
        Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      x-panelarr-read-only: true
      parameters:
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSearchRequest"
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSeriesPage"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/filters:
    get:
      operationId: sourceFilters
      tags: [sources]
      summary: A source's search filters
      description: Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: The filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFilters"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/series:
    get:
      operationId: sourceSeries
      tags: [sources]
      summary: A series on a source, in full
      description: Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SeriesKey"
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSeries"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/chapters:
    get:
      operationId: sourceChapters
      tags: [sources]
      summary: A series' chapters exactly as the source lists them
      description: Admins only since v1's admin-only sources change (users see sources only on a work; see docs/api.md).
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SeriesKey"
      responses:
        "200":
          description: The chapters, newest first as the source orders them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChapterList"
        default:
          $ref: "#/components/responses/Problem"

  /sources/{source_id}/image:
    get:
      operationId: sourceImage
      tags: [sources]
      summary: An image from a source (covers, icons)
      description: |
        Only image links the server handed out work (they are signed); the
        image is fetched through the source's plugin and cached. Stays open
        to users: a work's series carry these links for their covers.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - name: ref
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4000
        - name: sig
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Background jobs
      x-panelarr-access: admin
      responses:
        "200":
          description: Every job with its schedule and last run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobList"
        default:
          $ref: "#/components/responses/Problem"

  /jobs/{job_id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: One job
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Problem"

  /jobs/{job_id}/runs:
    get:
      operationId: listJobRuns
      tags: [jobs]
      summary: A job's runs, newest first
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobRunStatus"
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunList"
        default:
          $ref: "#/components/responses/Problem"

  /jobs/{job_id}/run:
    post:
      operationId: runJob
      tags: [jobs]
      summary: Run a job now
      description: A job that is running answers `409`, code `already_running`, with the running run's ID in the detail. Parameters the job doesn't know, or that don't fit, answer `400`.
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunJobRequest"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunSummary"
        default:
          $ref: "#/components/responses/Problem"

  /job-runs/{run_id}:
    get:
      operationId: getJobRun
      tags: [jobs]
      summary: One run in full
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRun"
        default:
          $ref: "#/components/responses/Problem"

  /job-runs/{run_id}/cancel:
    post:
      operationId: cancelJobRun
      tags: [jobs]
      summary: Cancel a running run
      description: "`409` with code `not_running` for a finished run, `not_cancellable` for jobs that can't stop midway."
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Cancelling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunSummary"
        default:
          $ref: "#/components/responses/Problem"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: Queued, running and recent tasks
      x-panelarr-access: admin
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            maxLength: 100
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/TaskState"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: Tasks, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        default:
          $ref: "#/components/responses/Problem"

  /tasks/{task_id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: One task
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel a queued or running task
      description: "`409`, code `task_finished`, when it already ended."
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /tasks/{task_id}/retry:
    post:
      operationId: retryTask
      tags: [tasks]
      summary: Run a failed or cancelled task again
      description: "`409`, code `not_retryable`, for other states or when the same work is queued already."
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: The task, queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Problem"

  /queue:
    get:
      operationId: getQueue
      tags: [tasks]
      summary: The task queue per kind
      x-panelarr-access: admin
      responses:
        "200":
          description: Each kind's counts and state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
        default:
          $ref: "#/components/responses/Problem"

  /queue/kinds/{kind}:
    patch:
      operationId: updateQueueKind
      tags: [tasks]
      summary: Pause or resume a kind of task
      description: Queued tasks of a paused kind wait; running ones finish.
      x-panelarr-access: admin
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueueKindRequest"
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueState"
        default:
          $ref: "#/components/responses/Problem"

  /events:
    get:
      operationId: streamEvents
      tags: [system]
      summary: Live events (server-sent events)
      description: |
        A `text/event-stream` of what changes, filtered to what the caller
        may see: `task.queued`, `task.started`, `task.progress`,
        `task.updated` (admins and the task's requester), `job.started`,
        `job.progress`, `job.done`, `job.failed` (admins), and more as
        features arrive (`work.updated`, `chapter.downloaded`, …). Each
        event's `data` is JSON. The stream opens with a `ready` event and
        sends a comment every 25 seconds to keep proxies from closing it.
        Events aren't replayed: after reconnecting, refetch what you show.

        | Event | Who gets it | `data` schema |
        |---|---|---|
        | `ready` | the caller | `{}` |
        | `task.queued`, `task.started`, `task.progress`, `task.updated` | admins, the task's requester | `TaskEvent` |
        | `job.started`, `job.progress`, `job.done`, `job.failed` | admins | `JobEvent` |
        | `plugin.health` | admins | `PluginEvent` (after each check of a plugin; refetch it for its sources) |
        | `work.updated` | admins, the work's followers | `WorkEvent` |
        | `chapters.new` | admins, the work's followers | `WorkEvent` (`new`) |
        | `chapter.downloaded` | admins, the work's followers | `WorkEvent` (`chapter_id`) |
        | `library.changed` | the user | `WorkEvent` |
        | `progress.synced` | the user (all devices) | `WorkEvent` (`chapter_id`, `page`, `completed` when one chapter changed) |
      x-panelarr-access: user
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"

  /library:
    get:
      operationId: listLibrary
      tags: [library]
      summary: Your library
      description: Works you follow, by title. Works you may no longer see (your ceiling or allowed sources changed) are left out.
      x-panelarr-access: user
      parameters:
        - name: q
          in: query
          description: Only titles containing this.
          schema:
            type: string
            maxLength: 200
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of your library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addToLibrary
      tags: [library]
      summary: Add a catalogue entry to your library
      description: |
        Creates the work for the entry when nobody has it yet (one work per
        entry, shared by everyone) and starts matching it on the sources.
        Adding it again returns `200` with the existing entry. With
        `source`, that series is attached to the work (e.g. when you picked
        the entry after adding from a source). Needs the `may_add` grant
        (`403`, code `grant_required`).
      x-panelarr-access: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToLibraryRequest"
      responses:
        "200":
          description: It was in your library already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        default:
          $ref: "#/components/responses/Problem"

  /library/from-source:
    post:
      operationId: addFromSource
      tags: [library]
      summary: Add a series seen on a source
      description: |
        Finds the series' catalogue entry. When it is clear (the exact
        title and a shared author), the work is added with the series
        attached (`added`). Otherwise the likely entries come back as
        `candidates`: pick one and add it with `POST /library` and this
        series as `source`. Needs `may_add`.

        Stays open to users although browsing sources is for admins: the
        caller's grants and `may_add` still apply, and admins add from
        their source view with it.
      x-panelarr-access: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeriesRef"
      responses:
        "200":
          description: Added, or candidates to pick from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddFromSourceResult"
        default:
          $ref: "#/components/responses/Problem"

  /library/{work_id}:
    delete:
      operationId: removeFromLibrary
      tags: [library]
      summary: Remove a work from your library
      description: Never deletes downloaded files; they are shared.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}:
    get:
      operationId: getWork
      tags: [library]
      summary: A work, with how it is matched on each source
      description: Lists every source you may use with its matching state, the attached series and candidates with their evidence.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: The work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Work"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/cover:
    get:
      operationId: getWorkCover
      tags: [library]
      summary: A work's cover
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/match:
    post:
      operationId: matchWork
      tags: [library]
      summary: Match the work on the sources again
      description: Searches every source without an attached series (with `force`, every source; attached series stay). Series rejected before are not attached again. Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchWorkRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRef"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/series:
    post:
      operationId: attachSeries
      tags: [library]
      summary: Attach a series to the work by source and key, or by its URL
      description: The series becomes the work's series on its source (the one attached before becomes a candidate). A URL no plugin recognises answers `404`. Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachSeriesRequest"
      responses:
        "201":
          description: Attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSeries"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/sources/{source_id}/search:
    post:
      operationId: searchWorkSource
      tags: [library]
      summary: Search one of the work's sources by hand, to fix its match
      description: |
        The source search for fixing a work's match, open to users with
        `may_manage_matches` (browsing a source directly is for admins).
        The source must be usable and allowed by the caller's source
        grants, else `404`. Each result carries `match` when the work
        already knows that series (attached, candidate or rejected); any
        result can be attached with `POST /works/{work_id}/series` and its
        `key`. A POST because filter values are structured; it only reads.
      x-panelarr-access: user
      x-panelarr-read-only: true
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/SourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceSearchRequest"
      responses:
        "200":
          description: A page of series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSeriesPage"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/series/{series_id}:
    patch:
      operationId: updateWorkSeries
      tags: [library]
      summary: Set a series' priority for the work
      description: Higher priority wins when the same chapter is on several sources. Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/SeriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkSeriesRequest"
      responses:
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSeries"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/series/{series_id}/attach:
    post:
      operationId: attachCandidate
      tags: [library]
      summary: Attach a candidate (or a rejected series)
      description: Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Attached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSeries"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/series/{series_id}/detach:
    post:
      operationId: detachSeries
      tags: [library]
      summary: Reject a series for the work
      description: Matching won't attach it again. Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchSeries"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/chapters:
    get:
      operationId: listWorkChapters
      tags: [chapters]
      summary: A work's unified chapters
      description: |
        One row per chapter across all the work's sources: chapters with the
        same number on several sources are one chapter, and a chapter
        missing on one source is filled from another. Each shows the chosen
        copy (variant) and why (`reason`): `pinned`, `only_source`,
        `language` (the instance's preferred languages), `healthier_source`,
        `priority` (the series' priority), `newest_upload` or
        `first_listed`. Chapters without a number stay per source and come
        last. `new` marks chapters found since you last marked the work
        seen.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: order
          in: query
          description: asc (reading order, the default) or desc.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: The chapters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterList"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/chapters/{chapter_id}:
    get:
      operationId: getWorkChapter
      tags: [chapters]
      summary: One chapter with every copy
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: The chapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/chapters/{chapter_id}/pin:
    put:
      operationId: pinChapterVariant
      tags: [chapters]
      summary: Choose a chapter's copy by hand
      description: A pinned copy wins until it disappears from its source. `variant_id` null unpins. Needs `may_manage_matches`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinVariantRequest"
      responses:
        "200":
          description: The chapter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterDetail"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/series/{series_id}/chapters:
    get:
      operationId: listSeriesChapters
      tags: [chapters]
      summary: One source's chapters of the work, as the source lists them
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: The source's chapters in its own order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesChapterList"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/refresh:
    post:
      operationId: refreshWork
      tags: [chapters]
      summary: Check the work's sources for new chapters now
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "202":
          description: Checks queued, one per attached series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshQueued"
        default:
          $ref: "#/components/responses/Problem"

  /library/{work_id}/seen:
    post:
      operationId: markWorkSeen
      tags: [library]
      summary: Clear the work's "new" chapter badges for you
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204":
          description: Seen.
        default:
          $ref: "#/components/responses/Problem"

  /chapters/{chapter_id}/pages:
    get:
      operationId: getChapterPages
      tags: [reader]
      summary: A chapter's pages for the reader
      description: |
        The pages of the chapter's chosen copy (or `variant_id`'s), with
        the previous and next chapters in reading order and your progress.
        When the chosen copy is on a source you may not use, another copy
        is used; `404` with code `no_copy` when none is left.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/ChapterId"
        - $ref: "#/components/parameters/VariantIdQuery"
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterPages"
        default:
          $ref: "#/components/responses/Problem"

  /chapters/{chapter_id}/pages/{index}:
    get:
      operationId: getChapterPage
      tags: [reader]
      summary: One page image
      description: Fetched through the source's plugin (its headers and network settings apply), never by the browser from the site.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/ChapterId"
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 10000
        - $ref: "#/components/parameters/VariantIdQuery"
      responses:
        "200":
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /chapters/{chapter_id}/progress:
    put:
      operationId: setChapterProgress
      tags: [reader]
      summary: Save where you are in a chapter
      description: Reaching the last page (when `pages` is given) marks the chapter read, unless `completed` says otherwise. Your other devices get a `progress.synced` event.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProgressRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterProgress"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/progress:
    get:
      operationId: getWorkProgress
      tags: [reader]
      summary: Your progress in a work, and where to continue
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: Progress per chapter you started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkProgress"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: markChaptersRead
      tags: [reader]
      summary: Mark chapters read or unread
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "204":
          description: Done.
        default:
          $ref: "#/components/responses/Problem"

  /me/history:
    get:
      operationId: getMyHistory
      tags: [reader]
      summary: Chapters you read, newest first
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPage"
        default:
          $ref: "#/components/responses/Problem"

  /me/reader-settings:
    get:
      operationId: getReaderSettings
      tags: [reader]
      summary: Your reader settings for a place
      description: |
        Settings live at three levels: global, per source and per work
        (series). `effective` merges them, a more specific level's keys
        winning. Their shape belongs to the client (zoom, fit, mode,
        direction, …); the server stores JSON objects up to 16 KiB.
      x-panelarr-access: user
      parameters:
        - name: source_id
          in: query
          schema:
            type: string
            maxLength: 300
        - name: work_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Each level and the effective settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReaderSettings"
        default:
          $ref: "#/components/responses/Problem"

  /me/reader-settings/{scope}:
    parameters:
      - name: scope
        in: path
        required: true
        description: global, source:<source id> or work:<work id>.
        schema:
          type: string
          maxLength: 310
          pattern: "^(global|source:.+|work:[0-9a-fA-F-]{36})$"
    put:
      operationId: putReaderSettings
      tags: [reader]
      summary: Replace one level of your reader settings
      x-panelarr-access: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteReaderSettings
      tags: [reader]
      summary: Remove one level (fall back to the broader ones)
      x-panelarr-access: user
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /me/preferences:
    get:
      operationId: getMyPreferences
      tags: [me]
      summary: Your app preferences
      description: Theme, colours, fonts and other choices that follow you across devices. The shape belongs to the client; up to 16 KiB.
      x-panelarr-access: user
      responses:
        "200":
          description: The preferences ({} when none).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putMyPreferences
      tags: [me]
      summary: Replace your app preferences
      x-panelarr-access: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"

  /storages:
    get:
      operationId: listStorages
      tags: [storage]
      summary: Storage endpoints for downloads
      x-panelarr-access: admin
      responses:
        "200":
          description: Storages, the default first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createStorage
      tags: [storage]
      summary: Add a storage
      description: The server writes, reads and deletes a probe first; a storage that fails answers `422` with code `storage_check_failed` and the reason.
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageInfo"
        default:
          $ref: "#/components/responses/Problem"

  /storages/{storage_id}:
    parameters:
      - $ref: "#/components/parameters/StorageId"
    patch:
      operationId: updateStorage
      tags: [storage]
      summary: Change a storage, or make it the default
      description: New settings are checked first. Making a storage the default sends new downloads there; existing files stay where they are (move them with a task).
      x-panelarr-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStorageRequest"
      responses:
        "200":
          description: The storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageInfo"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteStorage
      tags: [storage]
      summary: Remove an empty storage
      description: "`409` with code `storage_in_use` while files are on it, or `storage_default` for the default."
      x-panelarr-access: admin
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Problem"

  /storages/{storage_id}/test:
    post:
      operationId: testStorage
      tags: [storage]
      summary: Check a storage now
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/StorageId"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageTest"
        default:
          $ref: "#/components/responses/Problem"

  /storages/{storage_id}/move:
    post:
      operationId: moveStorage
      tags: [storage]
      summary: Move every file to another storage
      description: Runs as a task (with progress); files stay readable throughout.
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/StorageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveStorageRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRef"
        default:
          $ref: "#/components/responses/Problem"

  /works/{work_id}/downloads:
    post:
      operationId: downloadChapters
      tags: [downloads]
      summary: Download chapters of a work
      description: |
        Give `chapter_ids`, or `scope`: `all` or `unread` (chapters you
        haven't finished). Chapters downloaded or queued already (by
        anyone) aren't queued again; files are stored once for everyone.
        Needs `may_download`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadChaptersRequest"
      responses:
        "202":
          description: What was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadsQueued"
        default:
          $ref: "#/components/responses/Problem"

  /downloads:
    get:
      operationId: listDownloads
      tags: [downloads]
      summary: Download queue and history
      description: Your downloads (admins see everyone's with `all=true`), newest first, with live progress over the event stream (`task.progress`, `chapter.downloaded`). Admins cancel, retry and pause through the task endpoints.
      x-panelarr-access: user
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/TaskState"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageToken"
      responses:
        "200":
          description: A page of downloads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadPage"
        default:
          $ref: "#/components/responses/Problem"

  /library/{work_id}/auto-download:
    put:
      operationId: setAutoDownload
      tags: [downloads]
      summary: Download new chapters of a work automatically
      description: New chapters found by update checks are queued for download. Needs `may_download`.
      x-panelarr-access: user
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoDownloadRequest"
      responses:
        "204":
          description: Saved.
        default:
          $ref: "#/components/responses/Problem"

  /chapters/{chapter_id}/file:
    delete:
      operationId: deleteChapterFile
      tags: [downloads]
      summary: Delete a chapter's downloaded file
      description: Files are only deleted by admins; removing works from libraries never deletes them.
      x-panelarr-access: admin
      parameters:
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: panelarr_session
      description: Browser session. Changes also need the `X-CSRF-Token` header.
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: A personal API key.
    bearer:
      type: http
      scheme: bearer
      description: A personal API key as a bearer token.

  parameters:
    StorageId:
      name: storage_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
    VariantIdQuery:
      name: variant_id
      in: query
      description: Read this copy instead of the chosen one.
      schema:
        type: string
        format: uuid
    ChapterId:
      name: chapter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkId:
      name: work_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeriesId:
      name: series_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9._-]*$"
        maxLength: 100
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PluginId:
      name: plugin_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
    SourceId:
      name: source_id
      in: path
      required: true
      description: The source's ID, "plugin:source".
      schema:
        type: string
        minLength: 3
        maxLength: 300
    SourcePage:
      name: page
      in: query
      description: The page, from 1.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    SeriesKey:
      name: key
      in: query
      required: true
      description: The series' key on the source, as listed.
      schema:
        type: string
        minLength: 1
        maxLength: 2000
    EntryId:
      name: entry_id
      in: path
      required: true
      description: The metadata service's entry ID.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Lang:
      name: lang
      in: query
      description: Preferred language for titles and descriptions (BCP 47, e.g. "en", "ja-Latn"). Default from the Accept-Language header.
      schema:
        type: string
        maxLength: 35
        pattern: "^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$"
    CatalogType:
      name: type
      in: query
      description: Only these types, e.g. manga, manhwa, manhua, webtoon, comic, light_novel.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          pattern: "^[a-z_]{1,40}$"
    CatalogStatus:
      name: status
      in: query
      description: Only these statuses, e.g. releasing, completed, hiatus, cancelled, upcoming.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items:
          type: string
          pattern: "^[a-z_]{1,40}$"
    CatalogGenre:
      name: genre
      in: query
      description: Only entries with all of these genres.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 100
    YearFrom:
      name: year_from
      in: query
      schema:
        type: integer
        minimum: 1800
        maximum: 3000
    YearTo:
      name: year_to
      in: query
      schema:
        type: integer
        minimum: 1800
        maximum: 3000
    CatalogSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [relevance, popularity, rating, updated, year, title]
    Reverse:
      name: reverse
      in: query
      description: Reverse the sort order.
      schema:
        type: boolean
    CatalogPageSize:
      name: page_size
      in: query
      description: Entries per page, 1 to 100. Default 30.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageSize:
      name: page_size
      in: query
      description: Items per page, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    PageToken:
      name: page_token
      in: query
      description: The `next_page_token` of the previous page.
      schema:
        type: string
        maxLength: 512

  responses:
    Problem:
      description: An error, as RFC 9457 problem details.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    StorageInfo:
      type: object
      required: [id, name, kind, default, has_secret, files]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [local, s3]
        default:
          type: boolean
        root:
          type: string
          description: Local storages' directory.
        endpoint:
          type: string
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        path_style:
          type: boolean
        access_key:
          type: string
        has_secret:
          type: boolean
          description: A secret key is stored (never shown).
        files:
          type: integer
          format: int64
    StorageList:
      type: object
      required: [storages]
      properties:
        storages:
          type: array
          items:
            $ref: "#/components/schemas/StorageInfo"
    StorageSettings:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        root:
          type: string
          maxLength: 1000
          description: Local storages; an absolute path.
        endpoint:
          type: string
          maxLength: 500
          description: S3, e.g. "https://s3.example.com".
        region:
          type: string
          maxLength: 100
        bucket:
          type: string
          maxLength: 100
        prefix:
          type: string
          maxLength: 200
        path_style:
          type: boolean
        access_key:
          type: string
          maxLength: 200
        secret_key:
          type: string
          maxLength: 500
          description: Leave out to keep the stored one.
    CreateStorageRequest:
      allOf:
        - $ref: "#/components/schemas/StorageSettings"
        - type: object
          required: [id, name, kind]
          properties:
            id:
              type: string
              pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
            kind:
              type: string
              enum: [local, s3]
    UpdateStorageRequest:
      allOf:
        - $ref: "#/components/schemas/StorageSettings"
        - type: object
          properties:
            default:
              type: boolean
              description: true makes it the default storage.
    StorageTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    MoveStorageRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"
    DownloadChaptersRequest:
      type: object
      properties:
        chapter_ids:
          type: array
          maxItems: 5000
          items:
            type: string
            format: uuid
        scope:
          type: string
          enum: [all, unread]
    DownloadsQueued:
      type: object
      required: [queued, downloaded, unavailable]
      properties:
        queued:
          type: integer
        downloaded:
          type: integer
          description: Already downloaded; nothing to do.
        unavailable:
          type: integer
          description: No source lists them.
    DownloadItem:
      type: object
      required: [task, work_id, work_title, chapter_id, chapter_title]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        chapter_id:
          type: string
          format: uuid
        work_id:
          type: string
