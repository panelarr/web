            $ref: "#/components/schemas/ChapterVariant"
    PinVariantRequest:
      type: object
      required: [variant_id]
      properties:
        variant_id:
          type: [string, "null"]
          format: uuid
    SeriesChapter:
      type: object
      required: [key, name, display_title, present]
      properties:
        display_title:
          type: string
          description: 'The chapter''s own name without its number, volume or scanlator noise ("Vol. 1 Chapter 1: Double Dungeon" → "Double Dungeon"); empty when the name says nothing else, so show "Chapter N".' 
        key:
          type: string
        name:
          type: string
        number:
          type: number
        volume:
          type: string
        scanlator:
          type: string
        lang:
          type: string
        url:
          type: string
        uploaded_at:
          type: string
          format: date-time
        present:
          type: boolean
          description: False when the source no longer lists it.
        chapter_id:
          type: string
          format: uuid
          description: The unified chapter it belongs to.
    SeriesChapterList:
      type: object
      required: [series, chapters]
      properties:
        series:
          $ref: "#/components/schemas/MatchSeries"
        checked_at:
          type: string
          format: date-time
        check_error:
          type: string
        chapters:
          type: array
