      properties:
        entry_title:
          type: string
        matched_title:
          type: string
          description: The entry's title that matched best.
        query:
          type: string
          description: The search that found it.
        title_score:
          type: number
        authors_match:
          type: boolean
        source_authors:
          type: array
          items:
            type: string
        chapter_count:
          type: integer
    MatchSeries:
      type: object
      required: [id, source_id, key, title, state, origin, score, priority, evidence]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
        key:
          type: string
        title:
          type: string
        url:
          type: string
        cover_url:
          type: string
        state:
          type: string
          enum: [attached, candidate, rejected]
        origin:
          type: string
          enum: [auto, manual, url]
        score:
          type: number
        priority:
          type: integer
        evidence:
          $ref: "#/components/schemas/MatchEvidence"
    WorkSourceState:
      type: object
      required: [source, status, queries, candidates]
      properties:
        source:
          $ref: "#/components/schemas/SourceInfo"
        status:
          type: string
          enum: [unchecked, pending, matched, candidates, no_match, failed]
        message:
