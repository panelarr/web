          type: integer

    WorkSummary:
      type: object
      required: [id, entry_id, title, content_rating, attached_sources]
      properties:
        id:
          type: string
          format: uuid
        entry_id:
          type: string
          description: The catalogue entry it was created from (see /catalog/entries).
        title:
          type: string
        type:
          type: string
        status:
          type: string
        content_rating:
          $ref: "#/components/schemas/EntryContentRating"
        year:
          type: integer
        cover_url:
          type: string
          description: The server's URL for the cover.
        attached_sources:
          type: integer
          description: Sources a series is attached on.
    LibraryEntry:
      type: object
      required: [work, added_at, new_chapters, bookmarks, auto_download, chapters, unread, downloaded, started]
      properties:
        auto_download:
          type: boolean
          description: New chapters are downloaded automatically.
        work:
          $ref: "#/components/schemas/WorkSummary"
        added_at:
          type: string
          format: date-time
        new_chapters:
          type: integer
          description: Chapters found since you last marked the work seen.
        bookmarks:
          type: integer
          description: Chapters of it you bookmarked.
        chapters:
          type: integer
          format: int64
          description: Its available chapters (as in its chapter list).
        unread:
          type: integer
          format: int64
          description: Its available chapters you haven't finished (the cover badge).
        downloaded:
          type: integer
          format: int64
          description: Its chapters stored as files.
        started:
          type: boolean
          description: You read some of it.
        continue_chapter_id:
          type: string
          format: uuid
          description: The chapter "Continue" opens (as GET /works/{work_id}/progress says); absent when there's nothing to read.
        last_read_at:
          type: string
          format: date-time
          description: When you last read in it.
        latest_chapter_at:
          type: string
          format: date-time
          description: When its newest chapter came out (or was first seen, when the source gives no date).
    LibraryPage:
      type: object
      required: [entries, next_page_token]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LibraryEntry"
        next_page_token:
          type: string
    SeriesRef:
      type: object
      required: [source_id, key]
      properties:
        source_id:
          type: string
          minLength: 3
          maxLength: 300
        key:
          type: string
          minLength: 1
          maxLength: 2000
    AddToLibraryRequest:
      type: object
      required: [entry_id]
      properties:
        entry_id:
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/SeriesRef"
    EntryCandidate:
      type: object
      required: [entry, score]
