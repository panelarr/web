    UnifiedChapter:
      type: object
      required: [id, title, display_title, extra, available, new, variants, reason, pinned, downloaded, bookmarked, created_at]
      properties:
        display_title:
          type: string
          description: 'The chapter''s own name without its number, volume or scanlator noise ("Vol. 1 Chapter 1: Double Dungeon" → "Double Dungeon"); empty when the name says nothing else, so show "Chapter N".' 
        bookmarked:
          type: boolean
          description: You bookmarked it.
        id:
          type: string
          format: uuid
        number:
          type: number
          description: Absent for chapters without a number (extras).
        volume:
          type: string
        title:
          type: string
        extra:
          type: boolean
        available:
          type: boolean
          description: False when no source lists it any more.
        new:
          type: boolean
        variants:
          type: integer
          description: How many copies across your sources.
        reason:
          type: string
          description: Why the chosen copy won.
        pinned:
          type: boolean
        downloaded:
          type: boolean
          description: Stored in the library (read from the file).
        chosen:
          $ref: "#/components/schemas/ChapterVariant"
        created_at:
          type: string
          format: date-time
          description: When the chapter was first found.
    ChapterList:
      type: object
      required: [chapters]
