          maxLength: 2000
    DuplicateNote:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
    ConfirmedDuplicate:
      type: object
      required: [pair, entry_id]
      properties:
        pair:
          $ref: "#/components/schemas/DuplicatePair"
        entry_id:
          type: string
          description: The entry the two are now.
    DuplicateJudge:
      type: object
      required: [enabled, kind, has_api_key, covers, origin]
      properties:
        enabled:
          type: boolean
        kind:
          type: string
          description: The kind of model service, as meta names it.
        url:
          type: string
        model:
          type: string
        has_api_key:
          type: boolean
        covers:
          type: boolean
          description: Send cover images to models that take them.
        origin:
          type: string
          description: Where the settings come from, "config" or "admin".
    DuplicateJudgeSettings:
      type: object
      required: [enabled, kind]
      properties:
        enabled:
          type: boolean
        kind:
          type: string
          maxLength: 100
        url:
          type: string
          maxLength: 2000
        model:
          type: string
          maxLength: 200
        api_key:
          type: string
          maxLength: 2000
          description: Never returned; empty keeps the stored one.
        covers:
          type: boolean
    DuplicateJudgeTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
        verdict:
          $ref: "#/components/schemas/DuplicateVerdict"
    SearchEngineSettings:
      type: object
      required: [backend]
      properties:
        backend:
          type: string
          enum: [postgres, typesense, meilisearch]
        url:
          type: string
          maxLength: 2000
          description: The engine's URL; meta talks to it, browsers never do.
        api_key:
          type: string
          maxLength: 2000
          description: Never returned; empty keeps the stored one.
        index_prefix:
          type: string
          maxLength: 100
        browse:
          type: string
          enum: [facets, engine, postgres]
          description: Who serves browsing without search text.
    MetaSearchEngine:
      type: object
      required: [settings, status]
      properties:
        settings:
          type: object
          required: [backend, has_api_key, origin]
          properties:
            backend:
              type: string
            url:
              type: string
            has_api_key:
              type: boolean
            index_prefix:
              type: string
            browse:
              type: string
            origin:
              type: string
              description: Where the settings come from, "config" or "admin".
        status:
          $ref: "#/components/schemas/SearchEngineStatus"
    SearchEngineStatus:
      type: object
      required: [backend, typo_tolerance, substring, facets, ready, reachable, degraded, documents, pending, applied]
      properties:
        backend:
          type: string
          description: The backend answering searches now.
        typo_tolerance:
          type: boolean
        substring:
          type: boolean
        facets:
          type: boolean
        ready:
          type: boolean
          description: The index is built and searches use it.
        reachable:
          type: boolean
        error:
          type: string
        error_at:
          type: string
          format: date-time
        degraded:
          type: boolean
          description: Recent queries failed and the database answered them.
        index:
          type: string
        documents:
          type: integer
          format: int64
        built_at:
          type: string
          format: date-time
        pending:
          type: integer
          format: int64
          description: Entry changes waiting for the engine.
        lag_seconds:
          type: number
          description: The age of the oldest pending change.
        applied:
          type: integer
          format: int64
        indexer_error:
          type: string
        indexer_error_at:
          type: string
          format: date-time
    SearchEngineTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        error:
          type: string
    PackageDetails:
      type: object
      description: Set on installed packages.
      properties:
        signing_fingerprint:
          type: string
        api_version:
          type: string
          description: The version of the API the package was built for.
        installed_at:
          type: string
          format: date-time
        sha256:
          type: string
        origin_id:
          type: string
          description: The origin it was installed from.
    PackageOrigin:
      type: object
      required: [id, name, package_count]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        refreshed_at:
          type: string
          format: date-time
        error:
          type: string
          description: Why the last refresh failed.
        package_count:
          type: integer
        signing_key_fingerprint:
          type: string
          description: The pinned signing key of its packages.
    PackageOriginList:
      type: object
      required: [origins]
      properties:
        origins:
          type: array
          items:
            $ref: "#/components/schemas/PackageOrigin"
    SetHealthCheckRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    PluginJob:
      type: object
      required:
      - id
      - name
      - description
      - group
      - schedule
      - running
      - cancellable
      - params
      properties:
        disabled_reason:
          type: string
          description: "Why the job can't run now (e.g. a feature it needs is off); absent when it can. Running it answers `409`, code `job_disabled`, and its schedule doesn't fire meanwhile."
        id:
          type: string
        name:
          type: string
        description:
          type: string
        group:
          type: string
        schedule:
          $ref: '#/components/schemas/JobSchedule'
        running:
          type: boolean
        current_run_id:
          type: string
        last_run:
          $ref: '#/components/schemas/PluginJobRunSummary'
        next_run_at:
          type: string
          format: date-time
        cancellable:
          type: boolean
        params:
          type: array
          items:
            $ref: '#/components/schemas/JobParam'
      description: As `Job`, field for field, except that run IDs are the plugin's own strings.
    PluginJobRunSummary:
      type: object
      required:
      - id
      - job_id
      - status
      - trigger
      - started_at
      - message
      - counts
      properties:
        id:
          type: string
          description: The plugin's own run ID (not always a UUID).
        job_id:
          type: string
        status:
          $ref: '#/components/schemas/JobRunStatus'
        trigger:
          type: string
          enum:
          - schedule
          - manual
          - startup
          - system
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        message:
          type: string
        counts:
          type: object
          additionalProperties:
            type: integer
            format: int64
        triggered_by:
          type: string
      description: As `JobRunSummary`, field for field, except that run IDs are the plugin's own strings.
    PluginJobRun:
      type: object
      required:
      - summary
      - params
      - notes
      properties:
        summary:
          $ref: '#/components/schemas/PluginJobRunSummary'
        params:
          type: object
          additionalProperties:
            type: string
        notes:
          type: array
          items:
            $ref: '#/components/schemas/JobRunNote'
        progress:
          $ref: '#/components/schemas/JobProgress'
      description: As `JobRun`, field for field, except that run IDs are the plugin's own strings.
    PluginJobList:
      type: object
      required:
      - jobs
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/PluginJob'
      description: As `JobList`, field for field, except that run IDs are the plugin's own strings.
    PluginJobRunList:
      type: object
      required:
      - runs
      - next_page_token
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/PluginJobRunSummary'
        next_page_token:
          type: string
      description: As `JobRunList`, field for field, except that run IDs are the plugin's own strings.
    SeriesMatchRef:
      type: object
      description: How a work already knows a series.
      required: [series_id, state]
      properties:
        series_id:
          type: string
          format: uuid
          description: The work's series (`/works/{work_id}/series/{series_id}`).
        state:
          type: string
          enum: [attached, candidate, rejected]
    SourceSeries:
      type: object
      required: [key, title, alt_titles, authors, artists, genres]
      properties:
        key:
          type: string
          description: The series' key on the source; pass it back as is.
        title:
          type: string
        alt_titles:
          type: array
          items:
            type: string
        authors:
          type: array
          items:
            type: string
        artists:
          type: array
          items:
            type: string
        description:
          type: string
        genres:
          type: array
          items:
            type: string
        status:
          type: string
          description: ongoing, completed, licensed, publishing_finished, cancelled, on_hiatus or absent when unknown.
        cover_url:
          type: string
          description: The server's URL for the cover.
        url:
          type: string
          description: The series' page on the site.
        match:
          $ref: "#/components/schemas/SeriesMatchRef"
          description: Only in a work's source search, when the work already knows the series.
    SourceSeriesPage:
      type: object
      required: [series, has_next_page]
      properties:
        series:
          type: array
          items:
            $ref: "#/components/schemas/SourceSeries"
        has_next_page:
          type: boolean
    SourceSearchRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 200
        page:
          type: integer
          minimum: 1
          maximum: 10000
        filters:
          type: array
          maxItems: 200
          description: Filter values in the source plugin contract's JSON form, e.g. {"path":[2],"select":1}.
          items:
            type: object
            additionalProperties: true
    SourceFilters:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          description: The source's filters in the source plugin contract's JSON form (headers, separators, text, checkboxes, tri-states, selects, sorts, groups).
          items:
            type: object
            additionalProperties: true
    SourceChapter:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
        name:
          type: string
        number:
          type: number
        volume:
          type: string
        scanlator:
          type: string
        uploaded_at:
          type: string
          format: date-time
        lang:
          type: string
        url:
          type: string
    SourceChapterList:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/SourceChapter"

    MetaProvider:
      type: object
      required: [id, health, records]
      properties:
        id:
          type: string
        health:
          type: string
          description: ok, degraded, down or unknown.
        message:
          type: string
        records:
          type: integer
          format: int64
          description: Records the provider has delivered so far.
    MetaCheck:
      type: object
      required: [configured, reachable, key_valid, admin_scope, ready, providers, checked_at]
      properties:
        configured:
          type: boolean
        reachable:
          type: boolean
        key_valid:
          type: boolean
        admin_scope:
          type: boolean
        ready:
          type: boolean
          description: Reachable, an admin key, and a provider with entries.
        problem:
          type: string
          description: What to do, when not ready.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MetaProvider"
        checked_at:
          type: string
          format: date-time
    MetaConnection:
      type: object
      required: [managed_by_env, check]
      properties:
        url:
          type: string
          description: Empty when not connected. The key is never shown.
        managed_by_env:
          type: boolean
          description: The connection comes from PANELARR_META_URL and can't be changed here.
        check:
          $ref: "#/components/schemas/MetaCheck"
    SetMetaConnectionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The service's base URL, e.g. "http://meta:8901".
          minLength: 1
          maxLength: 500
        api_key:
          type: string
          description: A key with the admin scope. Leave out to keep the stored one.
          maxLength: 500
    RunMetaSyncRequest:
      type: object
      properties:
        kind:
          type: string
          description: The sync kind the provider supports, "dump" (full import, the default) or "delta".
          enum: [dump, delta]
    MetaSyncStarted:
      type: object
      required: [run_id]
      properties:
        run_id:
          type: string

    Attribution:
      type: object
      required: [provider]
      description: Where data comes from and under which terms. Show it next to the data.
      properties:
        provider:
          type: string
        url:
          type: string
        license:
          type: string
        license_url:
          type: string
        notice:
          type: string
    CatalogCover:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The server's URL for the image, relative to the server, e.g. "/api/v1/catalog/entries/{id}/cover".
        width:
          type: integer
        height:
          type: integer
        blurhash:
          type: string
          description: A placeholder to show while the image loads.
        thumbhash:
          type: string
    EntryContentRating:
      type: string
      enum: [safe, suggestive, erotic, pornographic, unknown]
    CatalogEntrySummary:
      type: object
      required: [id, title, content_rating, genres, attribution]
      properties:
        library_work_id:
          type: string
          format: uuid
          description: The work, when this entry is in your library.
        id:
          type: string
        title:
          type: string
          description: The title in the requested language when known.
        type:
          type: string
          description: e.g. manga, manhwa, manhua, webtoon, comic, light_novel. Absent when unknown; the list may grow.
        status:
          type: string
          description: releasing, completed, hiatus, cancelled, upcoming or unknown. Absent when unknown.
        content_rating:
          $ref: "#/components/schemas/EntryContentRating"
        year:
          type: integer
        original_language:
          type: string
        cover:
          $ref: "#/components/schemas/CatalogCover"
        genres:
          type: array
          items:
            type: string
        rating:
          type: number
          description: Average score from 0 to 10, when known.
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/Attribution"
    CatalogPage:
      type: object
      required: [entries, next_page_token, no_providers]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntrySummary"
        next_page_token:
          type: string
        total_size:
          type: integer
          format: int64
          description: The number of matches, when the catalogue knows it.
        no_providers:
          type: boolean
          description: The metadata service has no provider, so the catalogue is empty.
    CatalogSearchHit:
      type: object
      required: [entry]
      properties:
        entry:
          $ref: "#/components/schemas/CatalogEntrySummary"
        matched:
          type: string
          description: The title or name that matched, when it isn't the shown title.
    CatalogSearchPage:
      type: object
      required: [hits, next_page_token, no_providers]
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSearchHit"
        next_page_token:
          type: string
        total_size:
          type: integer
          format: int64
        no_providers:
          type: boolean
    CatalogTitle:
      type: object
      required: [text, kind, primary]
      properties:
        text:
          type: string
        language:
          type: string
          description: BCP 47, e.g. "ja", "ja-Latn", "en".
        kind:
          type: string
          description: official, native, romanized, alternative, unofficial or unknown.
        primary:
          type: boolean
    CatalogDescription:
      type: object
      required: [text, format]
      properties:
        text:
          type: string
        language:
          type: string
        format:
          type: string
          enum: [plain, markdown, html]
          description: HTML comes from the provider; sanitise it before showing.
    CatalogCredit:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
          description: author, artist, writer, illustrator, original_creator, …
        person_id:
          type: string
    CatalogTag:
      type: object
      required: [name, genre, spoiler]
      properties:
        name:
          type: string
        genre:
          type: boolean
        spoiler:
          type: boolean
    CatalogExternalId:
      type: object
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
        url:
          type: string
    CatalogLink:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
        url:
          type: string
        title:
          type: string
    CatalogEntry:
      type: object
      required: [id, title, content_rating, titles, descriptions, credits, genres, tags, external_ids, links, attribution]
      properties:
        library_work_id:
          type: string
          format: uuid
          description: The work, when this entry is in your library.
        id:
          type: string
        title:
          type: string
        type:
          type: string
        status:
          type: string
        content_rating:
          $ref: "#/components/schemas/EntryContentRating"
        original_language:
          type: string
        year:
          type: integer
          description: The year it started.
        end_year:
          type: integer
        cover:
          $ref: "#/components/schemas/CatalogCover"
        titles:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTitle"
        descriptions:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDescription"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/CatalogCredit"
        genres:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTag"
        external_ids:
          type: array
          items:
            $ref: "#/components/schemas/CatalogExternalId"
        links:
          type: array
          items:
            $ref: "#/components/schemas/CatalogLink"
        attribution:
          type: array
          items:
            $ref: "#/components/schemas/Attribution"

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type; "about:blank" when only the status applies.
          examples: ["about:blank"]
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong in this occurrence, for people.
        instance:
          type: string
          description: The request path.
        code:
          type: string
          description: |
            A stable, machine-readable error code. Common ones:
            `invalid_request`, `unauthenticated`, `forbidden`, `csrf_failed`,
            `not_found`, `setup_required`, `rate_limited`, `internal`.
          pattern: "^[a-z][a-z0-9_]*$"
        request_id:
          type: string
          description: The request's ID, also in the X-Request-Id header and the server log.
        current_run_id:
          type: string
          format: uuid
          description: With code `already_running`, the run that is going on.
        current_run:
          type: string
          description: With code `already_running` from a plugin's jobs, the run that is going on (the plugin's own ID).
        errors:
          type: array
          description: Per-field validation errors.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The field, e.g. "grants.allowed_sources".
        message:
          type: string

    SystemInfo:
      type: object
      required: [name, version, setup_required]
      properties:
        name:
          type: string
          description: Always "panelarr".
          const: panelarr
        version:
          type: string
          description: The server version, e.g. "0.3.1", or "dev".
        setup_required:
          type: boolean
          description: True until the first account (the admin) exists.

    HealthStatus:
      type: string
      enum: [ok, degraded, unavailable]
      description: "`unavailable`: a required component fails. `degraded`: an optional one fails."
    ComponentHealth:
      type: object
      required: [name, required, status]
      properties:
        name:
          type: string
        required:
          type: boolean
          description: Whether the server can't work without it.
        status:
          type: string
          enum: [ok, failing]
        error:
          type: string
        latency_ms:
          type: integer
    SystemHealth:
      type: object
      required: [status, version, components]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentHealth"

    SetupStatus:
      type: object
      required: [admin_created, meta_configured, meta_ready, completed]
      properties:
        admin_created:
          type: boolean
          description: The first account exists.
        meta_configured:
          type: boolean
          description: The metadata service is connected.
        meta_ready:
          type: boolean
          description: The metadata service is usable (see `GET /system/meta` for details).
        completed:
          type: boolean
          description: An admin finished the wizard.
        completed_at:
          type: string
          format: date-time
    CreateSetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        display_name:
          $ref: "#/components/schemas/DisplayName"

    Username:
      type: string
      description: Letters, digits, `.`, `_` and `-`, starting with a letter or digit. Case-insensitively unique.
      minLength: 2
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
    Password:
      type: string
      description: 8 to 256 characters.
      minLength: 8
      maxLength: 256
    DisplayName:
      type: string
      maxLength: 100
    Role:
      type: string
      enum: [admin, user]
      description: Admins may do everything; users what their grants allow.
    ContentRating:
      type: string
      enum: [safe, suggestive, erotic, pornographic]
      description: Content ratings from mildest to strongest.
    Grants:
      type: object
      description: What a user may do. Admins may always do everything, whatever their grants say.
      required: [may_add, may_download, may_manage_matches, content_rating_ceiling, all_sources, allowed_sources]
      properties:
        may_add:
          type: boolean
          description: Add works to their library.
        may_download:
          type: boolean
          description: Queue downloads.
        may_manage_matches:
          type: boolean
          description: Fix source matches, pin chapter variants and set source priorities for works.
        content_rating_ceiling:
          $ref: "#/components/schemas/ContentRating"
        all_sources:
          type: boolean
          description: Every source is allowed, including ones added later. When false, only `allowed_sources`.
        allowed_sources:
          type: array
          description: Source IDs (`plugin:source`) the user may use when `all_sources` is false.
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 200
    GrantsPatch:
      type: object
      description: Only the fields sent change.
      properties:
        may_add:
          type: boolean
        may_download:
          type: boolean
        may_manage_matches:
          type: boolean
        content_rating_ceiling:
          $ref: "#/components/schemas/ContentRating"
        all_sources:
          type: boolean
        allowed_sources:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 200

    User:
      type: object
      required: [id, username, display_name, role, disabled, grants, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          description: Empty when not set; show the username then.
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        grants:
          $ref: "#/components/schemas/Grants"
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    UserList:
      type: object
      required: [users, next_page_token]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_page_token:
          type: string
    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        display_name:
          $ref: "#/components/schemas/DisplayName"
        role:
          $ref: "#/components/schemas/Role"
        grants:
          $ref: "#/components/schemas/GrantsPatch"
    UpdateUserRequest:
      type: object
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"
        role:
          $ref: "#/components/schemas/Role"
        disabled:
          type: boolean
        password:
          $ref: "#/components/schemas/Password"
        grants:
          $ref: "#/components/schemas/GrantsPatch"

    Me:
      type: object
      required: [user, auth]
      properties:
        user:
          $ref: "#/components/schemas/User"
        auth:
          type: object
          required: [method, scopes]
          properties:
            method:
              type: string
              enum: [session, api_key]
            scopes:
              type: array
              description: For API keys, the key's scopes; for sessions, every scope the user's role allows.
              items:
                $ref: "#/components/schemas/ApiKeyScope"
    UpdateMeRequest:
      type: object
      properties:
        display_name:
          $ref: "#/components/schemas/DisplayName"
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          maxLength: 256
        new_password:
          $ref: "#/components/schemas/Password"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 256
    LoginResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrf_token:
          type: string
          description: Send it as `X-CSRF-Token` with changing requests. Also in the `panelarr_csrf` cookie.

    Session:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: The session making this request.
        user_agent:
          type: string
        ip:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    ApiKeyScope:
      type: string
      enum: [read, write, admin, "metrics:read"]
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The start of the key, to tell keys apart.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiKeyScope"
        expires_at:
          type: string
          format: date-time
          description: Optional. The key stops working then.
    ApiKeyCreated:
      type: object
      required: [api_key, key]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        key:
          type: string
          description: The key. Shown only here.

    InviteToken:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
    InviteCheck:
      type: object
      required: [role, expires_at]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        expires_at:
          type: string
          format: date-time
    AcceptInviteRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/Password"
        display_name:
          $ref: "#/components/schemas/DisplayName"
    Invite:
      type: object
      required: [id, role, grants, note, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/Role"
        grants:
          $ref: "#/components/schemas/Grants"
        note:
          type: string
          description: The admin's note, e.g. who it's for.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    CreateInviteRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/Role"
        grants:
          $ref: "#/components/schemas/GrantsPatch"
        note:
          type: string
          maxLength: 200
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          description: Default 72.
    InviteCreated:
      type: object
      required: [invite, token]
      properties:
        invite:
          $ref: "#/components/schemas/Invite"
        token:
          type: string
          description: The invite token. Shown only here.
