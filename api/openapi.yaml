        choice:
          type: string
          description: same_work, related_work or different.
        probabilities:
          type: object
          additionalProperties:
            type: number
        confidence:
          type: number
        tokens:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
    ConfirmDuplicateRequest:
      type: object
      properties:
        keep:
          type: string
          enum: [a, b]
          description: The entry that stays; absent keeps the more popular one.
