name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please **don't attach downloaded chapters, images or copied site data**; describe the behaviour or use made-up data instead. Security issues go through private reporting (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, the page and the device or browser (phone, desktop, installed app).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Panelarr version or web commit.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console lines or the request ID shown with the error. Remove API keys, tokens and credentials first.
      render: text
