name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check (lint, generated types, build with the CSP check, types, tests)
        run: make check

      - name: Generated files are committed
        run: git diff --exit-code -- src/routeTree.gen.ts src/api

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (desktop, phone, CSP)
        run: make e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  spec-drift:
    # Informational: tells whether the server's spec moved on since api/openapi.yaml was copied.
    name: Server spec drift
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: panelarr/server
          path: server
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Compare with the server's main
        env:
          SERVER_REPO: server
        run: node scripts/spec-sync.mjs --check
